<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما تو بلاس</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f0f15; color: #fff; padding: 20px; text-align: center; }
        header h1 { color: #e50914; font-size: 2.5rem; margin-bottom: 10px; }
        .search-container { max-width: 600px; margin: 0 auto 30px auto; display: flex; gap: 10px; }
        .search-container input { flex: 1; padding: 14px 20px; border: 1px solid #2a2a40; background: #1f1f2e; color: white; border-radius: 30px; outline: none; }
        .search-container button { padding: 0 30px; background: #e50914; border: none; color: white; border-radius: 30px; font-weight: bold; cursor: pointer; }
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; margin-top: 20px; }
        
        /* صندوق فحص المشاكل */
        .debug-box { max-width: 600px; margin: 40px auto 0 auto; padding: 15px; background: #222; border: 1px dashed #555; border-radius: 8px; text-align: left; font-family: monospace; color: #a9ffb7; font-size: 13px; direction: ltr; }
    </style>
</head>
<body>

    <header>
        <h1>سينما تو بلاس</h1>
        <p>شاهد أحدث الأفلام والمسلسلات مجاناً</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="ابحث هنا...">
        <button onclick="searchMedia()">بحث</button>
    </div>

    <h2 id="gridTitle">🔥 الأكثر رواجاً:</h2>
    <div class="movies-grid" id="moviesGrid">
        <p id="loadingText" style="grid-column: 1/-1; color:#ffbd03;">جاري الاتصال بقاعدة البيانات، يرجى الانتظار...</p>
    </div>

    <!-- صندوق كشف الأعطال الزائد -->
    <div class="debug-box" id="debugBox">إشارات الفحص: جاري بدء النظام...</div>

    <script>
        const TMDB_API_KEY = 'c7f20018c3cfc5d46cdc6f1defb13d3d'; 
        const debugBox = document.getElementById('debugBox');
        const moviesGrid = document.getElementById('moviesGrid');
        const loadingText = document.getElementById('loadingText');

        function logDebug(msg) {
            debugBox.innerHTML += "<br>> " + msg;
        }

        async function testConnection() {
            logDebug("Starting API call to TMDB...");
            try {
                const url = `https://themoviedb.org{TMDB_API_KEY}&language=ar`;
                logDebug("Request URL built successfully.");
                
                const response = await fetch(url);
                logDebug(`Server Response Received. Status Code: ${response.status} (${response.statusText})`);
                
                if (!response.ok) {
                    if(response.status === 401) {
                        logDebug("ERROR: المفتاح غير مفعل بعد أو خاطئ (Invalid API Key). يرجى الانتظار لتفعيله من TMDB.");
                        loadingText.innerText = "خطأ: مفتاح الـ API الخاص بك غير نشط حالياً، يرجى المحاولة بعد قليل.";
                    } else {
                        logDebug(`ERROR: Failed with code ${response.status}`);
                    }
                    return;
                }

                const data = await response.json();
                logDebug(`Data parsed. Found ${data.results.length} items.`);
                
                if(data.results.length > 0) {
                    loadingText.style.display = 'none';
                    moviesGrid.innerHTML = '';
                    data.results.forEach(item => {
                        const title = item.title || item.name;
                        if(!item.poster_path) return;
                        moviesGrid.innerHTML += `
                            <div style="background:#1f1f2e; padding:10px; border-radius:8px;">
                                <img src="https://tmdb.org{item.poster_path}" style="width:100%; height:250px; object-fit:cover; border-radius:6px;">
                                <p style="font-size:13px; margin-top:8px; font-weight:bold;">${title}</p>
                            </div>
                        `;
                    });
                    logDebug("SUCCESS: الأفلام تم عرضها على الشاشة بنجاح!");
                }

            } catch (error) {
                logDebug(`CRITICAL ERROR: ${error.message}`);
                logDebug("نصيحة: هناك حظر شبكة أو حماية متصفح تمنع الاتصال بـ TMDB من جهازك.");
                loadingText.innerText = "فشل الاتصال بسبب قيود الحماية في جهازك أو شبكتك.";
            }
        }

        window.onload = testConnection;
    </script>
</body>
</html>
