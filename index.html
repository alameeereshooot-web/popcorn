<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سينما بلس - أفلام ومسلسلات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e50914;
            --bg-black: #000000;
            --bg-surface: #0a0a0c;
            --bg-card: #121217;
            --text-main: #ffffff;
            --text-dim: #8b8b99;
            --player-height: 52vw;
            --max-player-height: 480px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
            padding-top: calc(min(var(--player-height), var(--max-player-height)) + 85px);
        }

        /* 1. المشغل الثابت في أعلى الصفحة */
        .fixed-player-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            background-color: var(--bg-black);
            border-bottom: 1px solid #1f1f23;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .player-screen {
            position: relative;
            width: 100%;
            height: min(var(--player-height), var(--max-player-height));
            background: #000;
        }

        .player-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .player-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #1a1a24 0%, #000 90%);
            color: var(--text-dim);
            text-align: center;
            padding: 20px;
        }

        .player-placeholder svg {
            width: 50px;
            height: 50px;
            fill: var(--primary);
            margin-bottom: 10px;
            opacity: 0.85;
        }

        /* شريط التحكم أسفل المشغل */
        .player-bar {
            padding: 8px 12px;
            background: var(--bg-black);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
        }

        .current-title {
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 55%;
        }

        .server-pills {
            display: flex;
            gap: 6px;
        }

        .server-btn {
            background: #1c1c24;
            color: #ddd;
            border: 1px solid #2e2e38;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
        }

        .server-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            font-weight: 700;
        }

        /* صندوق حلقات المسلسلات داخل شريط المشغل */
        .series-bar-ctrl {
            display: none;
            gap: 6px;
            align-items: center;
        }

        .series-bar-ctrl select {
            background: #181820;
            color: #fff;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 3px 6px;
            font-size: 11px;
            font-family: inherit;
        }

        /* 2. شريط البحث والتبويب */
        .search-nav {
            padding: 10px 14px;
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--bg-surface);
            border-bottom: 1px solid #181820;
        }

        .search-input {
            flex: 1;
            background: #121217;
            border: 1px solid #252530;
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        /* 3. شريط التصنيفات الجانبي / الأفقي العلوي */
        .categories-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 14px;
            background: var(--bg-black);
            scrollbar-width: none;
            position: sticky;
            top: calc(min(var(--player-height), var(--max-player-height)) + 80px);
            z-index: 100;
            border-bottom: 1px solid #141419;
        }

        .categories-container::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            white-space: nowrap;
            background: #111116;
            color: #aaa;
            border: 1px solid #22222a;
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-chip.active {
            background: #fff;
            color: #000;
            font-weight: 700;
            border-color: #fff;
        }

        /* 4. شبكة الكروت (الأفلام والمسلسلات) */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            padding: 14px;
        }

        @media (min-width: 600px) {
            .media-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 14px;
            }
        }

        .media-card {
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #1a1a22;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .media-card:hover, .media-card:active {
            transform: scale(0.98);
            border-color: var(--primary);
        }

        .poster-box {
            position: relative;
            width: 100%;
            padding-top: 145%;
            background: #0d0d12;
        }

        .poster-box img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-type {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
        }

        .card-info {
            padding: 6px 8px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 2px;
            display: flex;
            justify-content: space-between;
        }

        /* شاشة التحميل */
        .spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- 1. المشغل الثابت في أعلى الصفحة تماماً -->
    <div class="fixed-player-wrapper">
        <div class="player-screen">
            <div id="playerPlaceholder" class="player-placeholder">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span>اختر أي فيلم أو مسلسل من القائمة أدناه للتشغيل المباشر</span>
            </div>
            <!-- حظر النوافذ المنبثقة الصارم عبر sandbox لمنع الإعلانات -->
            <iframe id="mainIframe" 
                    allowfullscreen 
                    sandbox="allow-scripts allow-same-origin allow-forms">
            </iframe>
        </div>

        <div class="player-bar">
            <div id="nowPlayingTitle" class="current-title">جاهز للتشغيل</div>
            
            <!-- أزرار تبديل السيرفر -->
            <div class="server-pills">
                <button class="server-btn active" onclick="switchServer(1)">سيرفر 1 (عربي CC)</button>
                <button class="server-btn" onclick="switchServer(2)">سيرفر 2</button>
                <button class="server-btn" onclick="switchServer(3)">سيرفر 3</button>
            </div>

            <!-- تحكم حلقات المسلسل -->
            <div id="seriesCtrl" class="series-bar-ctrl">
                <select id="seasonSelect" onchange="onSeasonChange()"></select>
                <select id="episodeSelect" onchange="onEpisodeChange()"></select>
            </div>
        </div>
    </div>

    <!-- 2. شريط البحث -->
    <div class="search-nav">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن اسم الفيلم أو المسلسل..." oninput="handleSearch()">
    </div>

    <!-- 3. شريط المجموعات والتصنيفات -->
    <div class="categories-container" id="categoryTabs">
        <div class="cat-chip active" onclick="loadCategory('trending')">🔥 الرائج الآن</div>
        <div class="cat-chip" onclick="loadCategory('arabic_movies')">🎬 أفلام عربية</div>
        <div class="cat-chip" onclick="loadCategory('arabic_series')">📺 مسلسلات عربية</div>
        <div class="cat-chip" onclick="loadCategory('action')">💥 أكشن وحركة</div>
        <div class="cat-chip" onclick="loadCategory('comedy')">😂 كوميديا</div>
        <div class="cat-chip" onclick="loadCategory('animation')">🎌 أنمي ورسوم</div>
        <div class="cat-chip" onclick="loadCategory('horror')">👻 رعب وإثارة</div>
    </div>

    <!-- 4. قائمة الأفلام والمسلسلات -->
    <div class="media-grid" id="mediaGrid">
        <div class="spinner">جاري تحميل الأفلام والمسلسلات...</div>
    </div>

    <script>
        const TMDB_KEY = 'c7f20018c3cfd61991209b5ce2d08a50';
        const IMG_URL = 'https://image.tmdb.org/t/p/w342';

        let currentMedia = null;
        let currentServer = 1;
        let currentSeason = 1;
        let currentEpisode = 1;

        // خوادم نظيفة مع دعم الترجمة العربية التلقائية
        function getEmbedUrl(media, server, s = 1, e = 1) {
            if (!media) return '';
            const id = media.id;
            const isTv = (media.media_type === 'tv' || media.first_air_date !== undefined);

            if (server === 1) {
                // VidLink مع تفعيل الترجمة العربية افتراضياً
                return isTv 
                    ? `https://vidlink.pro/tv/${id}/${s}/${e}?sub=ar`
                    : `https://vidlink.pro/movie/${id}?sub=ar`;
            } else if (server === 2) {
                // AutoEmbed سريع وبدون إعلانات
                return isTv 
                    ? `https://player.autoembed.cc/embed/tv/${id}/${s}/${e}`
                    : `https://player.autoembed.cc/embed/movie/${id}`;
            } else {
                // VidSrc VIP كبديل إضافي
                return isTv 
                    ? `https://vidsrc.vip/embed/tv/${id}/${s}/${e}`
                    : `https://vidsrc.vip/embed/movie/${id}`;
            }
        }

        function playMedia(item) {
            currentMedia = item;
            const isTv = (item.media_type === 'tv' || item.first_air_date !== undefined);
            const title = item.title || item.name;

            document.getElementById('playerPlaceholder').style.display = 'none';
            document.getElementById('nowPlayingTitle').innerText = title;

            // إظهار/إخفاء تحكم الحلقات للمسلسلات
            const seriesCtrl = document.getElementById('seriesCtrl');
            if (isTv) {
                seriesCtrl.style.display = 'flex';
                buildSeriesSelects(item.id);
            } else {
                seriesCtrl.style.display = 'none';
                loadIframeUrl();
            }

            // التمرير لأعلى لمشاهدة الفيديو فوراً
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function loadIframeUrl() {
            if (!currentMedia) return;
            const url = getEmbedUrl(currentMedia, currentServer, currentSeason, currentEpisode);
            const iframe = document.getElementById('mainIframe');
            iframe.src = url;
        }

        function switchServer(sNum) {
            currentServer = sNum;
            document.querySelectorAll('.server-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === sNum);
            });
            loadIframeUrl();
        }

        function buildSeriesSelects(tvId) {
            const seasonSelect = document.getElementById('seasonSelect');
            const episodeSelect = document.getElementById('episodeSelect');
            
            // جلب تفاصيل المسلسل لمعرفة عدد المواسم
            fetch(`https://api.themoviedb.org/3/tv/${tvId}?api_key=${TMDB_KEY}&language=ar`)
                .then(r => r.json())
                .then(data => {
                    seasonSelect.innerHTML = '';
                    const totalSeasons = data.number_of_seasons || 1;
                    for (let s = 1; s <= totalSeasons; s++) {
                        const opt = document.createElement('option');
                        opt.value = s;
                        opt.textContent = `موسم ${s}`;
                        seasonSelect.appendChild(opt);
                    }
                    currentSeason = 1;
                    buildEpisodeSelect(tvId, 1);
                })
                .catch(() => {
                    // خيار احتياطي في حال عدم جلب المواسم
                    seasonSelect.innerHTML = '<option value="1">موسم 1</option>';
                    buildEpisodeSelect(tvId, 1);
                });
        }

        function buildEpisodeSelect(tvId, seasonNum) {
            const episodeSelect = document.getElementById('episodeSelect');
            episodeSelect.innerHTML = '';
            
            fetch(`https://api.themoviedb.org/3/tv/${tvId}/season/${seasonNum}?api_key=${TMDB_KEY}&language=ar`)
                .then(r => r.json())
                .then(data => {
                    const eps = (data.episodes && data.episodes.length > 0) ? data.episodes.length : 30;
                    for (let e = 1; e <= eps; e++) {
                        const opt = document.createElement('option');
                        opt.value = e;
                        opt.textContent = `حلقة ${e}`;
                        episodeSelect.appendChild(opt);
                    }
                    currentEpisode = 1;
                    loadIframeUrl();
                })
                .catch(() => {
                    for (let e = 1; e <= 30; e++) {
                        const opt = document.createElement('option');
                        opt.value = e;
                        opt.textContent = `حلقة ${e}`;
                        episodeSelect.appendChild(opt);
                    }
                    currentEpisode = 1;
                    loadIframeUrl();
                });
        }

        function onSeasonChange() {
            currentSeason = parseInt(document.getElementById('seasonSelect').value);
            buildEpisodeSelect(currentMedia.id, currentSeason);
        }

        function onEpisodeChange() {
            currentEpisode = parseInt(document.getElementById('episodeSelect').value);
            loadIframeUrl();
        }

        // جلب المحتوى وعرض الكروت
        async function fetchMediaList(url) {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '<div class="spinner">جاري التحميل...</div>';
            try {
                const res = await fetch(url);
                const data = await res.json();
                renderCards(data.results || []);
            } catch (err) {
                grid.innerHTML = '<div class="spinner">حدث خطأ في جلب البيانات، يرجى المحاولة لاحقاً</div>';
            }
        }

        function renderCards(items) {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '';

            const validItems = items.filter(x => x.poster_path);
            if (validItems.length === 0) {
                grid.innerHTML = '<div class="spinner">لا توجد نتائج متوفرة</div>';
                return;
            }

            validItems.forEach(item => {
                const isTv = (item.media_type === 'tv' || item.first_air_date !== undefined);
                const title = item.title || item.name;
                const year = (item.release_date || item.first_air_date || '').substring(0, 4);

                const card = document.createElement('div');
                card.className = 'media-card';
                card.onclick = () => playMedia(item);

                card.innerHTML = `
                    <div class="poster-box">
                        <img src="${IMG_URL + item.poster_path}" alt="${title}" loading="lazy">
                        <span class="badge-type">${isTv ? 'مسلسل' : 'فيلم'}</span>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${title}</div>
                        <div class="card-meta">
                            <span>⭐ ${item.vote_average ? item.vote_average.toFixed(1) : '6.5'}</span>
                            <span>${year}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // التصنيفات
        function loadCategory(cat) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');

            let url = '';
            if (cat === 'trending') {
                url = `https://api.themoviedb.org/3/trending/all/day?api_key=${TMDB_KEY}&language=ar`;
            } else if (cat === 'arabic_movies') {
                url = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&with_original_language=ar&sort_by=popularity.desc`;
            } else if (cat === 'arabic_series') {
                url = `https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&with_original_language=ar&sort_by=popularity.desc`;
            } else if (cat === 'action') {
                url = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&with_genres=28&language=ar&sort_by=popularity.desc`;
            } else if (cat === 'comedy') {
                url = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&with_genres=35&language=ar&sort_by=popularity.desc`;
            } else if (cat === 'animation') {
                url = `https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&with_genres=16&language=ar&sort_by=popularity.desc`;
            } else if (cat === 'horror') {
                url = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_KEY}&with_genres=27&language=ar&sort_by=popularity.desc`;
            }
            fetchMediaList(url);
        }

        // محرك البحث
        let searchTimer = null;
        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            clearTimeout(searchTimer);
            if (!query) {
                loadCategory('trending');
                return;
            }
            searchTimer = setTimeout(() => {
                const url = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}&language=ar`;
                fetchMediaList(url);
            }, 400);
        }

        // التشغيل التلقائي عند فتح الصفحة
        window.onload = () => {
            loadCategory('trending');
        };
    </script>
</body>
</html>
