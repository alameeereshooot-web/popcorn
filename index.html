<script>
    const TMDB_API_KEY = 'c7f20018c3cfc5d46cdc6f1defb13d3d'; 

    let currentMediaId = null;
    let currentMediaType = null;

    const moviesGrid = document.getElementById('moviesGrid');
    const playerContainer = document.getElementById('playerContainer');
    const mainIframe = document.getElementById('mainIframe');
    const episodeControls = document.getElementById('episodeControls');
    const gridTitle = document.getElementById('gridTitle');
    const searchInput = document.getElementById('searchInput');
    const loadingText = document.getElementById('loadingText');

    async function fetchTrendingMedia() {
        try {
            // اتصال مباشر بـ TMDB بدون بروكسي وبالمسار الرسمي
            const url = `https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_API_KEY}&language=ar`;
            const response = await fetch(url);
            const data = await response.json();
            
            if (loadingText) loadingText.style.display = 'none';
            displayMedia(data.results || []);
        } catch (error) {
            console.error("خطأ:", error);
            if (loadingText) loadingText.innerText = "فشل تحميل الأفلام. تأكد من اتصال الإنترنت.";
        }
    }

    async function searchMedia() {
        const query = searchInput.value.trim();
        if (!query) return;
        moviesGrid.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>جاري البحث السريع...</p>";
        
        try {
            const url = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&language=ar&query=${encodeURIComponent(query)}`;
            const response = await fetch(url);
            const data = await response.json();
            
            gridTitle.innerText = "🔍 نتائج البحث عن: " + query;
            displayMedia(data.results || []);
        } catch (error) {
            console.error("خطأ:", error);
        }
    }

    searchInput.addEventListener("keyup", function(event) {
        if (event.key === "Enter") { searchMedia(); }
    });

    function displayMedia(items) {
        moviesGrid.innerHTML = '';
        let validCardsCount = 0;
        
        items.forEach(item => {
            const title = item.title || item.name;
            const mediaType = item.media_type || (item.title ? 'movie' : 'tv');
            
            if (!item.poster_path || !title || mediaType === 'person') return;
            
            validCardsCount++;
            const card = document.createElement('div');
            card.className = 'movie-card';
            
            const typeLabel = mediaType === 'movie' ? 'فيلم' : 'مسلسل';
            const ratingValue = item.vote_average ? item.vote_average.toFixed(1) : '0.0';
            
            // رابط البوستر من خادم صور TMDB الرسمي
            card.innerHTML = '<div class="badge">⭐ ' + ratingValue + '</div>' +
                             '<div class="type-badge">' + typeLabel + '</div>' +
                             '<img src="https://image.tmdb.org/t/p/w500' + item.poster_path + '" alt="' + title + '">' +
                             '<div class="movie-info"><div class="movie-title">' + title + '</div></div>';

            card.onclick = function() { startPlay(item.id, mediaType); };
            moviesGrid.appendChild(card);
        });

        if (validCardsCount === 0) {
            moviesGrid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color: #aaa;'>لا توجد نتائج متوفرة.</p>";
        }
    }

    function startPlay(id, type) {
        currentMediaId = id;
        currentMediaType = type;
        
        document.getElementById('seasonInput').value = 1;
        document.getElementById('episodeInput').value = 1;

        if (type === 'tv') {
            episodeControls.style.display = 'flex';
            loadEmbedUrl(id, 'tv', 1, 1);
        } else {
            episodeControls.style.display = 'none';
            loadEmbedUrl(id, 'movie');
        }

        playerContainer.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function loadEmbedUrl(id, type, season, episode) {
        let finalUrl = '';
        // استخدام سيرفر التضمين vidsrc بالمسار الصحيح
        if (type === 'movie') {
            finalUrl = `https://vidsrc.to/embed/movie/${id}`;
        } else {
            finalUrl = `https://vidsrc.to/embed/tv/${id}/${season}/${episode}`;
        }
        mainIframe.src = finalUrl;
    }

    function updateEpisode() {
        const season = document.getElementById('seasonInput').value;
        const episode = document.getElementById('episodeInput').value;
        loadEmbedUrl(currentMediaId, 'tv', season, episode);
    }

    function closePlayer() {
        playerContainer.style.display = 'none';
        mainIframe.src = '';
    }

    window.onload = fetchTrendingMedia;
</script>
