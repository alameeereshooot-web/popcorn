<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الاميري موفيز</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding-bottom: 30px;
        }

        #player-wrapper {
            position: sticky;
            top: 0;
            width: 100%;
            height: 240px;
            background-color: #000000;
            z-index: 1000;
            border-bottom: 1px solid #1a1a1a;
        }

        @media (min-width: 768px) {
            #player-wrapper { height: 480px; }
        }

        #main-player {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000000;
        }

        /* شريط موحد يحتوي على السيرفرات + TV + الجودة + الترجمة + الصوت */
        .controls-bar {
            background-color: #0a0a0a;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #1f1f1f;
            flex-wrap: wrap;
        }

        .server-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-server {
            background: #1e1e24;
            color: #aaa;
            border: 1px solid #333;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-server.active {
            background: #e50914;
            color: #fff;
            border-color: #e50914;
        }

        .btn-server:hover {
            background: #2a2a32;
        }

        .btn-tv {
            background: linear-gradient(135deg, #00c853, #009624);
            color: #ffffff !important;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            cursor: pointer;
            line-height: 1;
        }

        /* أزرار منسدلة مصغرة للأيقونات */
        .icon-dropdown {
            position: relative;
            display: inline-flex;
        }

        .icon-btn {
            background: #1e1e24;
            color: #ccc;
            border: 1px solid #333;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            min-width: 38px;
        }

        .icon-btn:hover,
        .icon-btn.active {
            background: #e50914;
            color: #fff;
            border-color: #e50914;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            min-width: 140px;
            z-index: 1500;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
        }

        .dropdown-menu.show {
            display: block;
            animation: fadeIn 0.15s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-item {
            display: block;
            width: 100%;
            background: transparent;
            color: #ddd;
            border: none;
            padding: 9px 14px;
            font-size: 13px;
            text-align: right;
            cursor: pointer;
            transition: all 0.15s;
        }

        .dropdown-item:hover {
            background: #2a2a32;
            color: #fff;
        }

        .dropdown-item.active {
            background: #e50914;
            color: #fff;
            font-weight: bold;
        }

        .now-playing-title {
            color: #e50914;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 100px;
        }

        .search-container {
            padding: 12px 14px 6px 14px;
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            background: #141414;
            border: 1px solid #282828;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: #e50914;
        }

        .search-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 0 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .categories-scroll {
            display: flex;
            gap: 8px;
            padding: 10px 14px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .categories-scroll::-webkit-scrollbar { display: none; }

        .cat-chip {
            background: #141414;
            color: #b3b3b3;
            border: 1px solid #262626;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
        }

        .cat-chip.active {
            background: #e50914;
            color: white;
            border-color: #e50914;
            font-weight: bold;
        }

        .section-header {
            padding: 12px 16px 6px 16px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-header::before {
            content: "";
            width: 4px;
            height: 16px;
            background: #e50914;
            border-radius: 2px;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px 14px;
        }

        @media (min-width: 600px) {
            .media-grid { grid-template-columns: repeat(4, 1fr); gap: 14px; }
        }
        @media (min-width: 900px) {
            .media-grid { grid-template-columns: repeat(6, 1fr); }
        }

        .card {
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            border: 1px solid #1f1f1f;
        }

        .card:active { transform: scale(0.96); }

        .card img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            display: block;
            background: #181818;
        }

        .card-info { padding: 6px; }
        .card-title {
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #eee;
        }

        .badge-type {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(0,0,0,0.75);
            color: #ffd700;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        #tv-controls {
            display: none;
            background: #111;
            padding: 8px 14px;
            border-bottom: 1px solid #222;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .tv-select {
            background: #222;
            color: #fff;
            border: 1px solid #333;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .loading-spinner i {
            font-size: 32px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="player-wrapper">
        <iframe id="main-player" 
                src="" 
                allowfullscreen="true" 
                webkitallowfullscreen="true" 
                mozallowfullscreen="true"
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture">
        </iframe>
    </div>

    <!-- شريط التحكم الموحد: السيرفرات + TV + الجودة + الترجمة + الصوت -->
    <div class="controls-bar">
        <div class="server-buttons">
            <button class="btn-server active" id="srv1" onclick="switchServer(1)">سيرفر 1</button>
            <button class="btn-server" id="srv2" onclick="switchServer(2)">سيرفر 2</button>
            <button class="btn-server" id="srv3" onclick="switchServer(3)">سيرفر 3</button>
            <button class="btn-server" id="srv4" onclick="switchServer(4)">سيرفر 4</button>
        </div>

        <a href="https://alameeereshooot-web.github.io/i/" class="btn-tv" title="الانتقال إلى البث المباشر">
            <i class="fas fa-tv"></i> Tv
        </a>

        <!-- زر الجودة -->
        <div class="icon-dropdown">
            <button class="icon-btn" onclick="toggleDropdown(event, 'quality-menu')" title="الجودة">
                <i class="fas fa-cog"></i>
            </button>
            <div class="dropdown-menu" id="quality-menu">
                <button class="dropdown-item active" onclick="changeQuality('1080p', this)">1080p - Full HD</button>
                <button class="dropdown-item" onclick="changeQuality('720p', this)">720p - HD</button>
                <button class="dropdown-item" onclick="changeQuality('480p', this)">480p - SD</button>
                <button class="dropdown-item" onclick="changeQuality('360p', this)">360p - Low</button>
            </div>
        </div>

        <!-- زر الترجمة -->
        <div class="icon-dropdown">
            <button class="icon-btn" onclick="toggleDropdown(event, 'subtitle-menu')" title="الترجمة">
                <i class="fas fa-closed-captioning"></i>
            </button>
            <div class="dropdown-menu" id="subtitle-menu">
                <button class="dropdown-item active" onclick="changeSubtitle('ar', this)">🇸🇦 العربية</button>
                <button class="dropdown-item" onclick="changeSubtitle('en', this)">🇬🇧 English</button>
                <button class="dropdown-item" onclick="changeSubtitle('fr', this)">🇫🇷 Français</button>
                <button class="dropdown-item" onclick="changeSubtitle('es', this)">🇪🇸 Español</button>
                <button class="dropdown-item" onclick="changeSubtitle('none', this)">بدون ترجمة</button>
            </div>
        </div>

        <!-- زر الصوت -->
        <div class="icon-dropdown">
            <button class="icon-btn" onclick="toggleDropdown(event, 'audio-menu')" title="الصوت">
                <i class="fas fa-volume-up"></i>
            </button>
            <div class="dropdown-menu" id="audio-menu">
                <button class="dropdown-item active" onclick="changeAudio('ar', this)">🇸🇦 العربية</button>
                <button class="dropdown-item" onclick="changeAudio('en', this)">🇬🇧 English</button>
                <button class="dropdown-item" onclick="changeAudio('fr', this)">🇫🇷 Français</button>
                <button class="dropdown-item" onclick="changeAudio('es', this)">🇪🇸 Español</button>
                <button class="dropdown-item" onclick="changeAudio('original', this)">🎬 الصوت الأصلي</button>
            </div>
        </div>

        <div class="now-playing-title" id="now-playing">اختر فيلماً للمشاهدة</div>
    </div>

    <div id="tv-controls">
        <span style="font-size: 12px; color: #aaa;">الموسم:</span>
        <select id="season-num" class="tv-select" onchange="updateEpisode()"></select>
        <span style="font-size: 12px; color: #aaa; margin-right: 6px;">الحلقة:</span>
        <select id="episode-num" class="tv-select" onchange="updateEpisode()"></select>
    </div>

    <div class="search-container">
        <input type="text" id="search-box" class="search-input" placeholder="ابحث عن فيلم أو مسلسل..." onkeypress="handleEnter(event)">
        <button class="search-btn" onclick="searchMedia()"><i class="fas fa-search"></i></button>
    </div>

    <div class="categories-scroll">
        <div class="cat-chip active" onclick="loadCategory('trending', this)">🔥 الأكثر رواجاً</div>
        <div class="cat-chip" onclick="loadCategory('action', this)">💥 أكشن وإثارة</div>
        <div class="cat-chip" onclick="loadCategory('series', this)">📺 مسلسلات</div>
        <div class="cat-chip" onclick="loadCategory('anime', this)">🎨 أنمي وكارتون</div>
        <div class="cat-chip" onclick="loadCategory('comedy', this)">😂 كوميديا</div>
        <div class="cat-chip" onclick="loadCategory('horror', this)">👻 رعب</div>
    </div>

    <div class="section-header" id="current-cat-title">الأكثر رواجاً</div>

    <div class="media-grid" id="grid"></div>

    <script>
        // ====== مفتاح TMDB ======
        const TMDB_API_KEY = 'c7f20018c3cfc5d46cdc6f1defb13d3d';
        const TMDB_BASE = 'https://api.themoviedb.org/3';
        const IMG_BASE = 'https://image.tmdb.org/t/p/w342';

        // ====== الكتالوج الاحتياطي ======
        const BACKUP_CATALOG = {
            trending: [
                { id: 533535, title: "Deadpool & Wolverine", type: "movie", poster: "https://image.tmdb.org/t/p/w342/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg" },
                { id: 1022789, title: "Inside Out 2", type: "movie", poster: "https://image.tmdb.org/t/p/w342/vpnVM9B6NMmQpWeZvzLvDESb2QY.jpg" },
                { id: 912649, title: "Venom: The Last Dance", type: "movie", poster: "https://image.tmdb.org/t/p/w342/aosm8Vh9ypZQIMejcuoTM6Fsiz0.jpg" },
                { id: 945961, title: "Alien: Romulus", type: "movie", poster: "https://image.tmdb.org/t/p/w342/b33nnKl1GSFbao4l3fZDDqsMx0F.jpg" },
                { id: 693134, title: "Dune: Part Two", type: "movie", poster: "https://image.tmdb.org/t/p/w342/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg" }
            ],
            action: [
                { id: 299534, title: "Avengers: Endgame", type: "movie", poster: "https://image.tmdb.org/t/p/w342/or06FN3Dka5tukK1e9sl16pB3iy.jpg" },
                { id: 299536, title: "Avengers: Infinity War", type: "movie", poster: "https://image.tmdb.org/t/p/w342/7WsyChQLEftFiDOVTGkv3hFpyyt.jpg" },
                { id: 603, title: "The Matrix", type: "movie", poster: "https://image.tmdb.org/t/p/w342/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg" },
                { id: 155, title: "The Dark Knight", type: "movie", poster: "https://image.tmdb.org/t/p/w342/qJ2tW6WMUDux911r6m7haRef0WH.jpg" }
            ],
            series: [
                { id: 94605, title: "Arcane", type: "tv", poster: "https://image.tmdb.org/t/p/w342/abPQHGqX6bqaN1z25f69h7w25Tf.jpg" },
                { id: 1396, title: "Breaking Bad", type: "tv", poster: "https://image.tmdb.org/t/p/w342/ztkUQFLlC19CCMYHW9o1zWhJRNq.jpg" },
                { id: 1399, title: "Game of Thrones", type: "tv", poster: "https://image.tmdb.org/t/p/w342/1XS1oqL89opfnbLl8WnZY1O1uJx.jpg" },
                { id: 66732, title: "Stranger Things", type: "tv", poster: "https://image.tmdb.org/t/p/w342/49WJfeN0moxb9IPfGn8AIqMGskD.jpg" }
            ],
            anime: [
                { id: 85937, title: "Demon Slayer", type: "tv", poster: "https://image.tmdb.org/t/p/w342/xUfRZu2mi8jH6SzQEJGP6tjBuYj.jpg" },
                { id: 1429, title: "Attack on Titan", type: "tv", poster: "https://image.tmdb.org/t/p/w342/hTP1DtLGFamjfu8WqjnuQdP1n4i.jpg" }
            ],
            comedy: [
                { id: 18785, title: "The Hangover", type: "movie", poster: "https://image.tmdb.org/t/p/w342/ulMsce9AoWoV0Gv2k25qH2xR6y4.jpg" },
                { id: 12133, title: "The Dictator", type: "movie", poster: "https://image.tmdb.org/t/p/w342/3w6bBfgjEHQG8h9j5jN4uU7U7Zf.jpg" }
            ],
            horror: [
                { id: 578, title: "Jaws", type: "movie", poster: "https://image.tmdb.org/t/p/w342/lxM6kqilAdpdhqUl2biY2gnqUha.jpg" },
                { id: 423204, title: "The Conjuring", type: "movie", poster: "https://image.tmdb.org/t/p/w342/wVYREutTvI2tmxr6ujrHT704wGF.jpg" }
            ]
        };

        let currentServer = 1;
        let currentItem = BACKUP_CATALOG.trending[0];
        let currentSeason = 1;
        let currentEpisode = 1;
        let currentQuality = '1080p';
        let currentSubtitle = 'ar';
        let currentAudio = 'ar';

        // ====== المشغلات (تم إلغاء السيرفر الأول القديم) ======
        const SERVERS = {
            1: {
                name: 'VidLink',
                movie: (id) => `https://vidlink.pro/movie/${id}`,
                tv: (id, s, e) => `https://vidlink.pro/tv/${id}/${s}/${e}`
            },
            2: {
                name: 'VidSrc.to',
                movie: (id) => `https://vidsrc.to/embed/movie/${id}`,
                tv: (id, s, e) => `https://vidsrc.to/embed/tv/${id}/${s}/${e}`
            },
            3: {
                name: 'VidSrc.me',
                movie: (id) => `https://vidsrc.me/embed/movie?tmdb=${id}`,
                tv: (id, s, e) => `https://vidsrc.me/embed/tv?tmdb=${id}&season=${s}&episode=${e}`
            },
            4: {
                name: '2Embed',
                movie: (id) => `https://www.2embed.cc/embed/${id}`,
                tv: (id, s, e) => `https://www.2embed.cc/embedtv/${id}&s=${s}&e=${e}`
            }
        };

        // ====== تشغيل الوسائط ======
        function playMedia() {
            const player = document.getElementById('main-player');
            const titleEl = document.getElementById('now-playing');
            titleEl.textContent = currentItem.title;

            const id = currentItem.id;
            const isTv = currentItem.type === 'tv';
            const server = SERVERS[currentServer];
            
            if (!server) return;

            let src = '';
            if (isTv) {
                src = server.tv(id, currentSeason, currentEpisode);
            } else {
                src = server.movie(id);
            }

            player.src = src;
        }

        function switchServer(num) {
            currentServer = num;
            for (let i = 1; i <= 4; i++) {
                const btn = document.getElementById('srv' + i);
                if (btn) btn.classList.toggle('active', i === num);
            }
            playMedia();
        }

        function selectMedia(id, type, title) {
            currentItem = { id, type, title };
            // ✅ إعادة تعيين الموسم والحلقة دائماً عند اختيار عمل جديد
            currentSeason = 1;
            currentEpisode = 1;

            const tvCtrl = document.getElementById('tv-controls');
            if (type === 'tv') {
                tvCtrl.style.display = 'flex';
                setupTvDropdowns();
            } else {
                tvCtrl.style.display = 'none';
            }

            playMedia();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setupTvDropdowns() {
            const sSelect = document.getElementById('season-num');
            const eSelect = document.getElementById('episode-num');
            // ✅ إعادة تعيين كاملة للقوائم
            sSelect.innerHTML = '';
            eSelect.innerHTML = '';
            for (let s = 1; s <= 10; s++) sSelect.innerHTML += `<option value="${s}">الموسم ${s}</option>`;
            for (let e = 1; e <= 24; e++) eSelect.innerHTML += `<option value="${e}">الحلقة ${e}</option>`;
            // ✅ تعيين القيم الافتراضية
            sSelect.value = '1';
            eSelect.value = '1';
        }

        function updateEpisode() {
            currentSeason = document.getElementById('season-num').value;
            currentEpisode = document.getElementById('episode-num').value;
            playMedia();
        }

        function renderList(items) {
            const grid = document.getElementById('grid');
            if (!items || items.length === 0) {
                grid.innerHTML = '<div class="loading-spinner" style="grid-column: 1/-1;"><i class="fas fa-search"></i><p style="margin-top:10px;">لا توجد نتائج</p></div>';
                return;
            }
            grid.innerHTML = items.map(it => {
                const badge = it.type === 'tv' ? 'مسلسل' : 'فيلم';
                const safeTitle = (it.title || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const poster = it.poster || 'https://via.placeholder.com/342x513/181818/666?text=No+Image';
                return `
                    <div class="card" onclick="selectMedia(${it.id}, '${it.type}', '${safeTitle}')">
                        <span class="badge-type">${badge}</span>
                        <img src="${poster}" alt="${safeTitle}" loading="lazy" onerror="this.src='https://via.placeholder.com/342x513/181818/666?text=No+Image'">
                        <div class="card-info">
                            <div class="card-title">${it.title}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ====== تحميل التصنيفات ======
        async function loadCategory(cat, chipEl) {
            if (chipEl) {
                document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
                chipEl.classList.add('active');
                document.getElementById('current-cat-title').textContent = chipEl.textContent.replace(/^[^\s]+ /, '');
            }

            document.getElementById('grid').innerHTML = '<div class="loading-spinner" style="grid-column: 1/-1;"><i class="fas fa-spinner"></i><p style="margin-top:10px;">جاري التحميل...</p></div>';

            try {
                let endpoint = '';
                const lang = 'ar';
                if (cat === 'trending') endpoint = `/trending/all/week?api_key=${TMDB_API_KEY}&language=${lang}`;
                else if (cat === 'action') endpoint = `/discover/movie?api_key=${TMDB_API_KEY}&with_genres=28&language=${lang}&sort_by=popularity.desc`;
                else if (cat === 'series') endpoint = `/tv/popular?api_key=${TMDB_API_KEY}&language=${lang}`;
                else if (cat === 'anime') endpoint = `/discover/tv?api_key=${TMDB_API_KEY}&with_genres=16&language=${lang}&sort_by=popularity.desc`;
                else if (cat === 'comedy') endpoint = `/discover/movie?api_key=${TMDB_API_KEY}&with_genres=35&language=${lang}&sort_by=popularity.desc`;
                else if (cat === 'horror') endpoint = `/discover/movie?api_key=${TMDB_API_KEY}&with_genres=27&language=${lang}&sort_by=popularity.desc`;

                const res = await fetch(TMDB_BASE + endpoint);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    const items = data.results
                        .filter(r => r.poster_path)
                        .map(r => ({
                            id: r.id,
                            title: r.title || r.name || 'Unknown',
                            type: r.media_type === 'tv' || r.first_air_date ? 'tv' : 'movie',
                            poster: IMG_BASE + r.poster_path
                        }));
                    if (items.length > 0) {
                        renderList(items);
                        return;
                    }
                }
            } catch (e) {
                console.warn('TMDB API فشل، استخدام الكتالوج الاحتياطي', e);
            }

            const items = BACKUP_CATALOG[cat] || BACKUP_CATALOG.trending;
            renderList(items);
        }

        // ====== البحث ======
        async function searchMedia() {
            const q = document.getElementById('search-box').value.trim();
            if (!q) return;

            document.getElementById('current-cat-title').textContent = `نتائج البحث: "${q}"`;
            document.getElementById('grid').innerHTML = '<div class="loading-spinner" style="grid-column: 1/-1;"><i class="fas fa-spinner"></i><p style="margin-top:10px;">جاري البحث...</p></div>';

            try {
                const res = await fetch(`${TMDB_BASE}/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(q)}&language=ar`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    const items = data.results
                        .filter(r => r.poster_path && (r.media_type === 'movie' || r.media_type === 'tv'))
                        .map(r => ({
                            id: r.id,
                            title: r.title || r.name || 'Unknown',
                            type: r.media_type,
                            poster: IMG_BASE + r.poster_path
                        }));
                    if (items.length > 0) {
                        renderList(items);
                        return;
                    }
                }
                renderList([]);
            } catch (e) {
                console.warn('فشل البحث عبر TMDB', e);
                const qLower = q.toLowerCase();
                let all = [];
                Object.values(BACKUP_CATALOG).forEach(list => all.push(...list));
                const unique = Array.from(new Map(all.map(it => [it.id, it])).values());
                const filtered = unique.filter(it => it.title.toLowerCase().includes(qLower));
                renderList(filtered);
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') searchMedia();
        }

        // ====== القوائم المنسدلة للأيقونات ======
        function toggleDropdown(event, menuId) {
            event.stopPropagation();
            const targetMenu = document.getElementById(menuId);
            const isOpen = targetMenu.classList.contains('show');

            // إغلاق جميع القوائم
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
            document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));

            // فتح القائمة المطلوبة إذا لم تكن مفتوحة
            if (!isOpen) {
                targetMenu.classList.add('show');
                event.currentTarget.classList.add('active');
            }
        }

        // إغلاق القوائم عند الضغط خارجها
        document.addEventListener('click', () => {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
            document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
        });

        // ====== تغيير الجودة ======
        function changeQuality(quality, btn) {
            currentQuality = quality;
            document.querySelectorAll('#quality-menu .dropdown-item').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            playMedia();
            showToast(`الجودة: ${quality}`);
        }

        // ====== تغيير الترجمة ======
        function changeSubtitle(lang, btn) {
            currentSubtitle = lang;
            document.querySelectorAll('#subtitle-menu .dropdown-item').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            playMedia();
            const langName = { ar: 'العربية', en: 'English', fr: 'Français', es: 'Español', none: 'بدون ترجمة' }[lang] || lang;
            showToast(`الترجمة: ${langName}`);
        }

        // ====== تغيير الصوت ======
        function changeAudio(lang, btn) {
            currentAudio = lang;
            document.querySelectorAll('#audio-menu .dropdown-item').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            playMedia();
            const langName = { ar: 'العربية', en: 'English', fr: 'Français', es: 'Español', original: 'الصوت الأصلي' }[lang] || lang;
            showToast(`الصوت: ${langName}`);
        }

        // ====== إشعار Toast ======
        function showToast(msg) {
            const existing = document.getElementById('toast-notify');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'toast-notify';
            toast.style.cssText = `
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%) translateY(20px);
                background: #e50914;
                color: #fff;
                padding: 10px 22px;
                border-radius: 8px;
                font-size: 13px;
                font-weight: bold;
                z-index: 3000;
                opacity: 0;
                transition: all 0.3s ease;
                box-shadow: 0 4px 20px rgba(229,9,20,0.4);
            `;
            toast.textContent = msg;
            document.body.appendChild(toast);
            requestAnimationFrame(() => {
                toast.style.opacity = '1';
                toast.style.transform = 'translateX(-50%) translateY(0)';
            });
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(20px)';
                setTimeout(() => toast.remove(), 300);
            }, 1800);
        }

        // ====== تشغيل فوري ======
        window.onload = () => {
            playMedia();
            loadCategory('trending', null);
        };
    </script>
</body>
</html>
